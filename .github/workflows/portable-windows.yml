name: Windows Portable Zip

on:
  workflow_dispatch:
    inputs:
      build_oneclick:
        description: "Also build embeddable one-click zip (slow, large)"
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap-zip:
    name: Portable bootstrap zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Stage and zip (bootstrap)
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          mkdir -p dist
          python packaging/stage_portable_layout.py \
            --dest dist \
            --version "$VERSION" \
            --zip "dist/Heytea-Painter-Windows-Portable-${VERSION}-bootstrap.zip"
          sha256sum "dist/Heytea-Painter-Windows-Portable-${VERSION}-bootstrap.zip" \
            | tee "dist/Heytea-Painter-Windows-Portable-${VERSION}-bootstrap.zip.sha256"

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-bootstrap
          path: |
            dist/*-bootstrap.zip
            dist/*-bootstrap.zip.sha256
          if-no-files-found: error

  oneclick-zip:
    name: Portable one-click zip (embeddable Python)
    # Fat zip (embeddable Python + torch) only on Release tags or manual dispatch.
    if: >
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.build_oneclick)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (host helper)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build one-click portable zip
        shell: pwsh
        run: |
          .\packaging\build_portable_zip.ps1 -Mode Embed

      - name: Upload one-click artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-oneclick
          path: |
            dist/*-oneclick.zip
            dist/*-oneclick.zip.sha256
          if-no-files-found: error

  publish-release:
    name: Attach portable zips to GitHub Release
    needs: [bootstrap-zip, oneclick-zip]
    if: >
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.bootstrap-zip.result == 'success'
      && (needs.oneclick-zip.result == 'success' || needs.oneclick-zip.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download bootstrap
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-bootstrap
          path: release-assets

      - name: Download one-click
        if: needs.oneclick-zip.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-oneclick
          path: release-assets

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
